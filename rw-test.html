<!doctype html>
<html><head><meta charset="utf-8"><title>Read Write Delete Test</title>
<style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 20px}button{padding:10px 16px;margin:5px}pre{padding:16px;background:#eee;white-space:pre-wrap}.pass{color:green}.fail{color:#b00020}</style></head>
<body>
<h1>Filesystem Read / Write / Delete Test</h1>
<p>Choose a folder, then test direct filesystem access. No IndexedDB, OPFS, downloads, API, service, or fallback is used.</p>
<button id="choose">Select Location</button>
<strong id="location">No location selected</strong><hr>
<button id="write" disabled>Write</button>
<button id="read" disabled>Read</button>
<button id="del" disabled>Delete</button>
<button id="all" disabled>Run All</button>
<pre id="log"></pre>
<script>
let dir=null;const NAME='tm-rw-test.json', log=document.querySelector('#log');
function say(s,ok){log.innerHTML+=`<span class="${ok===true?'pass':ok===false?'fail':''}">${s}</span>\n`}
function ready(v){['write','read','del','all'].forEach(x=>document.getElementById(x).disabled=!v)}
async function choose(){
 log.textContent='';
 if(typeof showDirectoryPicker!=='function'){say('FAIL: showDirectoryPicker is unavailable in this browser/context.',false);say('No fallback attempted.');return}
 try{dir=await showDirectoryPicker({mode:'readwrite'});location.textContent=dir.name;ready(true);say('LOCATION: '+dir.name,true)}
 catch(e){say('SELECT FAIL: '+e.message,false)}
}
async function write(){
 try{const h=await dir.getFileHandle(NAME,{create:true});const w=await h.createWritable();const data=JSON.stringify({test:'Task Management R/W',id:crypto.randomUUID(),writtenAt:new Date().toISOString()},null,2);await w.write(data);await w.close();say('WRITE PASS: '+NAME,true);return data}
 catch(e){say('WRITE FAIL: '+e.message,false);throw e}
}
async function read(){
 try{const h=await dir.getFileHandle(NAME);const f=await h.getFile();const text=await f.text();say('READ PASS: '+NAME,true);say(text);return text}
 catch(e){say('READ FAIL: '+e.message,false);throw e}
}
async function del(){
 try{await dir.removeEntry(NAME);say('DELETE PASS: '+NAME,true)}
 catch(e){say('DELETE FAIL: '+e.message,false);throw e}
}
choose.onclick=choose;write.onclick=()=>write();read.onclick=()=>read();del.onclick=()=>del();
all.onclick=async()=>{log.textContent='';try{const expected=await write();const actual=await read();if(actual!==expected)throw Error('read-back content does not match write');say('VERIFY PASS: exact content matched',true);await del();say('\nRESULT: READ / WRITE / VERIFY / DELETE PASS',true)}catch(e){say('\nRESULT: FAIL — '+e.message,false)}};
say('Browser: '+navigator.userAgent);say('Protocol: '+location.protocol);say('Secure context: '+isSecureContext);say('Directory picker: '+typeof showDirectoryPicker);
</script></body></html>
