<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Task Management</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <section id="setup-view" data-view class="auth-page hidden">
    <main class="auth-card">
      <div class="brand"><div class="brand-logo">TM</div><div><div class="brand-name" data-app-name>Task Management</div><div class="muted">Initial setup</div></div></div>
      <h1>Create administrator</h1>
      <p class="muted">This is the first account and receives system-administrator access.</p>
      <div id="setup-message" class="hidden"></div>
      <form id="setup-form" class="form-grid" autocomplete="off">
        <label>Username<input name="username" required minlength="3" maxlength="80" autofocus></label>
        <label>Display name<input name="displayName" maxlength="160"></label>
        <label>Email<input name="email" type="email" maxlength="254"></label>
        <label>Password<input name="password" type="password" required minlength="12" autocomplete="new-password"></label>
        <label>Confirm password<input name="confirmPassword" type="password" required minlength="12" autocomplete="new-password"></label>
        <button type="submit">Create administrator</button>
      </form>
    </main>
  </section>

  <section id="login-view" data-view class="auth-page hidden">
    <main class="auth-card">
      <div class="brand"><div class="brand-logo">TM</div><div><div class="brand-name" data-app-name>Task Management</div><div class="muted">Workspace</div></div></div>
      <h1>Sign in</h1><p class="muted">Use your local workspace account.</p>
      <div id="login-message" class="hidden"></div>
      <form id="login-form" class="form-grid">
        <label>Username<input name="username" required autocomplete="username" autofocus></label>
        <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
        <button type="submit">Sign in</button>
      </form>
    </main>
  </section>

  <section id="app-view" data-view class="hidden">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand"><div class="brand-logo">TM</div><div class="brand-name" data-app-name>Task Management</div></div>
        <nav class="nav">
          <button data-page="dashboard">Dashboard</button><button data-page="projects">Projects</button><button data-page="tasks">Tasks</button><button data-page="tickets">Tickets</button><button data-page="calendar">Calendar & Leave</button><button data-page="messages">Messages</button><button data-page="announcements">Announcements</button><button data-page="documents">Documents</button><button data-page="users">Users</button><button data-page="groups">Groups</button><button data-page="kpi">KPI</button><button data-page="settings">Settings</button>
        </nav>
      </aside>
      <main class="main"><header class="topbar"><strong data-app-name>Task Management</strong><div><span id="current-user"></span> &nbsp; <button id="logout" class="secondary">Sign out</button></div></header><div id="page-content" class="content"></div></main>
    </div>
  </section>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
