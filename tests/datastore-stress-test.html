<!doctype html><html><head><meta charset="utf-8"><title>Datastore Stress Test</title><style>body{font:15px system-ui;max-width:900px;margin:30px auto}button,input{padding:9px;margin:4px}pre{background:#eee;padding:15px;white-space:pre-wrap}</style></head><body><h1>Shared Datastore Stress Test</h1><input id="client" value="Client-A"><input id="count" type="number" value="1000" min="1" max="10000"><button id="select">Select/Restore Workspace</button><button id="run" disabled>Write Events</button><button id="scan" disabled>Scan & Verify</button><pre id="out"></pre><script src="../js/filesystem.js"></script><script src="../js/store.js"></script><script>
const log=s=>out.textContent+=s+'\n';select.onclick=async()=>{try{let h=await TM.FileSystem.restoreWorkspace();if(!h)h=await TM.FileSystem.selectWorkspace();await TM.FileSystem.ensurePermission();await TM.Store.init();run.disabled=scan.disabled=false;log('WORKSPACE PASS '+h.name)}catch(e){log('WORKSPACE FAIL '+e.message)}};run.onclick=async()=>{const who=client.value.trim(),n=Number(count.value);if(!who||!Number.isInteger(n)||n<1)return log('Invalid client/count');const t=performance.now();let ok=0;try{for(let i=0;i<n;i++){await TM.Store.createEvent(who,{sequence:i+1,nonce:crypto.randomUUID()});ok++;if(ok%100===0)log('WRITE '+ok+'/'+n)}log('WRITE PASS '+ok+' events in '+((performance.now()-t)/1000).toFixed(2)+'s')}catch(e){log('WRITE FAIL after '+ok+': '+e.message)}};scan.onclick=async()=>{const t=performance.now();try{const s=await TM.Store.scanEvents();log('FILES '+s.files);log('VALID '+s.valid);log('UNIQUE '+s.uniqueIds);log('CORRUPT '+s.corrupt);log('DUPLICATE IDS '+s.duplicateIds);log('CLIENTS '+JSON.stringify(s.clients));if(s.errors.length)log('ERRORS '+JSON.stringify(s.errors.slice(0,10)));log((s.corrupt===0&&s.duplicateIds===0&&s.valid===s.uniqueIds?'VERIFY PASS':'VERIFY FAIL')+' in '+((performance.now()-t)/1000).toFixed(2)+'s')}catch(e){log('SCAN FAIL '+e.message)}};</script></body></html>
