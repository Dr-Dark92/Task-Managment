<!doctype html><html><head><meta charset="utf-8"><title>Filesystem Foundation</title><style>body{font:15px system-ui;max-width:850px;margin:35px auto}button{padding:9px;margin:4px}pre{background:#eee;padding:15px;white-space:pre-wrap}</style></head><body><h1>TM.FileSystem Foundation Test</h1><button id="select">Select Workspace</button><button id="restore">Restore Handle</button><button id="init">Initialize</button><button id="test">Test Immutable JSON</button><pre id="out"></pre><script src="../js/filesystem.js"></script><script>
const log=s=>out.textContent+=s+'\n';select.onclick=async()=>{try{const h=await TM.FileSystem.selectWorkspace();log('SELECT PASS '+h.name)}catch(e){log('SELECT FAIL '+e.message)}};restore.onclick=async()=>{try{const h=await TM.FileSystem.restoreWorkspace();if(!h)throw Error('no saved handle');log('RESTORE PASS '+h.name+' permission='+await TM.FileSystem.permission())}catch(e){log('RESTORE FAIL '+e.message)}};init.onclick=async()=>{try{await TM.FileSystem.ensurePermission();await TM.FileSystem.initializeWorkspace();log('INIT PASS Task-Management-Data')}catch(e){log('INIT FAIL '+e.message)}};test.onclick=async()=>{try{await TM.FileSystem.ensurePermission();const name='EVT-'+crypto.randomUUID()+'.json',obj={id:name.slice(0,-5),client:crypto.randomUUID(),at:new Date().toISOString()};await TM.FileSystem.createJSON(['Task-Management-Data','Audit'],name,obj);log('CREATE PASS '+name);const x=await TM.FileSystem.readJSON(['Task-Management-Data','Audit'],name);if(x.id!==obj.id)throw Error('read mismatch');log('READ PASS');try{await TM.FileSystem.createJSON(['Task-Management-Data','Audit'],name,obj);throw Error('duplicate accepted')}catch(e){if(!/already exists/.test(e.message))throw e;log('IMMUTABLE PASS duplicate rejected')}await TM.FileSystem.remove(['Task-Management-Data','Audit'],name);log('DELETE PASS');log('RESULT PASS')}catch(e){log('RESULT FAIL '+e.message)}};</script></body></html>
