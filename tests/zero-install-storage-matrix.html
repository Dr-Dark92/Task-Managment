<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zero-Install Storage Capability Matrix</title>
<style>:root{color-scheme:dark}body{font:14px system-ui;max-width:1050px;margin:28px auto;padding:0 18px;background:#0f172a;color:#e2e8f0}.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:18px;margin:14px 0}button{padding:9px 13px;border:0;border-radius:8px;cursor:pointer;background:#2563eb;color:white}.ok{color:#86efac}.bad{color:#fca5a5}.warn{color:#fde68a}pre{white-space:pre-wrap;background:#020617;padding:12px;border-radius:8px}.muted{color:#94a3b8}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #334155;text-align:left}</style></head><body>
<h1>Stage 01B — Zero-Install Storage Capability Matrix</h1>
<p class="muted">Diagnostic only. It does not change application storage and does not weaken browser security. Run it from the exact production launch path/browser.</p>
<div class="card"><table><tbody id="matrix"></tbody></table></div>
<div class="card"><button id="probe">Run safe probes</button><pre id="out">Waiting…</pre></div>
<script>
const tests=[
 ['URL',()=>location.href],
 ['Protocol',()=>location.protocol],
 ['Secure context',()=>String(window.isSecureContext)],
 ['Directory picker',()=>typeof window.showDirectoryPicker],
 ['Open file picker',()=>typeof window.showOpenFilePicker],
 ['Save file picker',()=>typeof window.showSaveFilePicker],
 ['OPFS',()=>typeof navigator.storage?.getDirectory],
 ['IndexedDB',()=>typeof indexedDB],
 ['Origin',()=>location.origin],
 ['User agent',()=>navigator.userAgent]
];
const esc=s=>String(s).replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]));
for(const [k,f] of tests){let v;try{v=f()}catch(e){v=e.name+': '+e.message}matrix.insertAdjacentHTML('beforeend','<tr><th>'+esc(k)+'</th><td>'+esc(v)+'</td></tr>')}
probe.onclick=async()=>{const lines=[];const add=(ok,msg)=>lines.push((ok?'PASS ':'INFO ')+msg);
 try{const d=await new Promise((res,rej)=>{const r=indexedDB.open('tm-capability-probe',1);r.onupgradeneeded=()=>r.result.createObjectStore('probe');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});const t=d.transaction('probe','readwrite');t.objectStore('probe').put({at:new Date().toISOString()},'last');await new Promise((res,rej)=>{t.oncomplete=res;t.onerror=()=>rej(t.error)});add(true,'IndexedDB local persistence is writable.')}catch(e){add(false,'IndexedDB unavailable: '+e.message)}
 if(navigator.storage?.getDirectory){try{const root=await navigator.storage.getDirectory(),h=await root.getFileHandle('probe.txt',{create:true}),w=await h.createWritable();await w.write('probe');await w.close();await root.removeEntry('probe.txt');add(true,'OPFS is writable, but it is browser-private storage, NOT the SMB/share filesystem.')}catch(e){add(false,'OPFS probe failed: '+e.message)}}else add(false,'OPFS unavailable.');
 if(typeof window.showDirectoryPicker==='function')add(true,'Directory picker exists; explicit shared-folder access may be possible.');else add(false,'Directory picker absent; direct shared-folder handle cannot be obtained through File System Access API.');
 add(false,'A static file:// page cannot treat sibling SMB files as an unrestricted writable database merely because the OS account has write permission.');
 add(false,'No automatic fallback to local storage will be used for authoritative shared mode.');
 out.textContent=lines.join('\n')
};
</script></body></html>
