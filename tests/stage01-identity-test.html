<!doctype html><html><head><meta charset="utf-8"><title>Stage 01 Identity Test</title><style>body{font:15px system-ui;max-width:900px;margin:30px auto}button{padding:9px;margin:4px}pre{background:#eee;padding:15px;white-space:pre-wrap}</style></head><body><h1>Stage 01 — System + Identity</h1><button id="connect">Connect</button><button id="bootstrap" disabled>Bootstrap</button><button id="identity" disabled>Create Identity Test</button><button id="verify" disabled>Verify</button><pre id="out"></pre><script src="../js/filesystem.js"></script><script src="../js/store.js"></script><script>
const log=s=>out.textContent+=s+'\n';connect.onclick=async()=>{try{let h=await TM.FileSystem.restoreWorkspace();if(!h)h=await TM.FileSystem.selectWorkspace();await TM.FileSystem.ensurePermission();bootstrap.disabled=identity.disabled=verify.disabled=false;log('CONNECT PASS '+h.name)}catch(e){log('CONNECT FAIL '+e.message)}};bootstrap.onclick=async()=>{try{const r=await TM.Store.bootstrapSystem();log('BOOTSTRAP PASS schema='+r.schema.version+' roles='+r.roles.length)}catch(e){log('BOOTSTRAP FAIL '+e.message)}};identity.onclick=async()=>{try{await TM.Store.bootstrapSystem();const tag=crypto.randomUUID().slice(0,8),u=await TM.Store.createUser({username:'test-'+tag,displayName:'Test User '+tag}),g=await TM.Store.createGroup({name:'Test Group '+tag}),roles=await TM.Store.list('role'),role=roles.find(x=>x.systemKey==='employee');const m=await TM.Store.addMembership({userId:u.id,groupId:g.id,roleId:role.id});log('USER PASS '+u.id);log('GROUP PASS '+g.id);log('MEMBERSHIP PASS '+m.id)}catch(e){log('IDENTITY FAIL '+e.message)}};verify.onclick=async()=>{try{const [users,groups,roles,memberships]=await Promise.all(['user','group','role','membership'].map(TM.Store.list));const bad=[...users,...groups,...roles,...memberships].filter(x=>x._corrupt);log('USERS '+users.length);log('GROUPS '+groups.length);log('ROLES '+roles.length);log('MEMBERSHIPS '+memberships.length);log('CORRUPT '+bad.length);log((roles.length>=4&&bad.length===0?'VERIFY PASS':'VERIFY FAIL'))}catch(e){log('VERIFY FAIL '+e.message)}};</script></body></html>
