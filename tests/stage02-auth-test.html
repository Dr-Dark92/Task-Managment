<!doctype html><html><head><meta charset="utf-8"><title>Stage 02 Auth Test</title><style>body{font:15px system-ui;max-width:900px;margin:30px auto}button,input{padding:9px;margin:4px}pre{background:#eee;padding:15px;white-space:pre-wrap}</style></head><body><h1>Stage 02 — Authentication + RBAC</h1><input id="user" value="admin-test"><input id="pass" type="password" value="Jarvis-Test-2026!"><button id="select">Select Fresh Workspace</button><button id="restore">Restore Saved Workspace</button><button id="hash" disabled>Password Test</button><button id="admin" disabled>Bootstrap First Admin</button><button id="login" disabled>Login + RBAC</button><pre id="out"></pre><script src="../js/filesystem.js"></script><script src="../js/store.js"></script><script src="../js/auth.js"></script><script>
const log=s=>out.textContent+=s+'\n',enable=()=>{hash.disabled=admin.disabled=login.disabled=false};
async function ready(h){await TM.FileSystem.ensurePermission();await TM.Store.bootstrapSystem();const users=(await TM.Store.list('user')).filter(x=>!x._corrupt);enable();log('CONNECT PASS '+h.name);log('EXISTING USERS '+users.length);if(users.length)log('INFO: first-admin bootstrap is closed for this workspace. Select a fresh workspace to test bootstrap.')}
select.onclick=async()=>{try{const h=await TM.FileSystem.selectWorkspace();await ready(h)}catch(e){log('SELECT FAIL '+e.message)}};
restore.onclick=async()=>{try{const h=await TM.FileSystem.restoreWorkspace();if(!h)throw Error('No saved workspace');await ready(h)}catch(e){log('RESTORE FAIL '+e.message)}};
hash.onclick=async()=>{try{const r=await TM.Auth.passwordRecord(pass.value),ok=await TM.Auth.verifyPassword(pass.value,r),bad=await TM.Auth.verifyPassword(pass.value+'x',r);log('PBKDF2 '+r.passwordIterations+' iterations');log(ok&&!bad?'PASSWORD PASS':'PASSWORD FAIL')}catch(e){log('PASSWORD FAIL '+e.message)}};
admin.onclick=async()=>{try{const u=await TM.Auth.firstAdmin({username:user.value,displayName:'Test Administrator',password:pass.value});log('FIRST ADMIN PASS '+u.id)}catch(e){log('FIRST ADMIN INFO '+e.message)}};
login.onclick=async()=>{try{const r=await TM.Auth.login(user.value,pass.value);log('LOGIN PASS '+r.user.id);log('SESSION PASS '+r.session.id);log(await TM.Auth.can(r.user.id,'users.create')?'RBAC PASS wildcard Administrator':'RBAC FAIL');try{await TM.Auth.login(user.value,pass.value+'WRONG');log('BAD PASSWORD FAIL accepted')}catch{log('BAD PASSWORD PASS rejected')}}catch(e){log('LOGIN FAIL '+e.message)}};
</script></body></html>
