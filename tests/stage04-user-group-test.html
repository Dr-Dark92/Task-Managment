<!doctype html><html><head><meta charset="utf-8"><title>Stage 04 User Group Management</title><style>body{font:15px system-ui;max-width:900px;margin:30px auto}button{padding:9px;margin:4px}pre{background:#eee;padding:15px;white-space:pre-wrap}</style></head><body><h1>Stage 04 — User & Group Management</h1><button id="select">Select Stage02/03 Workspace</button><button id="run" disabled>Run Management Test</button><pre id="out"></pre><script src="../js/filesystem.js"></script><script src="../js/store.js"></script><script src="../js/auth.js"></script><script src="../js/identity.js"></script><script src="../js/admin.js"></script><script>const log=s=>out.textContent+=s+'\n';select.onclick=async()=>{try{const h=await TM.FileSystem.selectWorkspace();await TM.FileSystem.ensurePermission();await TM.Store.bootstrapSystem();run.disabled=false;log('CONNECT PASS '+h.name)}catch(e){log('CONNECT FAIL '+e.message)}};run.onclick=async()=>{try{const admins=await TM.Identity.activeAdmins();if(!admins.length)throw Error('No active Administrator');const actor=admins[0],roles=await TM.Store.list('role'),employee=roles.find(r=>r.systemKey==='employee'),suffix=crypto.randomUUID().slice(0,8);const group=await TM.Admin.createGroup(actor,{name:'Stage04-'+suffix,description:'Integration test'});log('GROUP CREATE PASS '+group.id);const u=await TM.Admin.createUser(actor,{username:'employee-'+suffix,displayName:'Stage 04 Employee',password:'Stage04-Test-2026!',roleId:employee.id,groupId:group.id});log('USER CREATE PASS '+u.id);try{await TM.Admin.createUser(actor,{username:u.username,displayName:'Duplicate',password:'Stage04-Test-2026!'});log('USERNAME UNIQUE FAIL')}catch(e){log('USERNAME UNIQUE PASS '+e.message)}log(await TM.Auth.can(u.id,'tasks.view')?'EMPLOYEE RBAC PASS':'EMPLOYEE RBAC FAIL');try{await TM.Admin.createGroup(u.id,{name:'Forbidden-'+suffix});log('PERMISSION FAIL employee created group')}catch(e){log('PERMISSION PASS '+e.message)}await TM.Admin.setUserEnabled(actor,u.id,false);const state=await TM.Identity.userState(u.id);log(!state.enabled?'DISABLE EVENT PASS':'DISABLE EVENT FAIL')}catch(e){log('TEST FAIL '+e.message)}};</script></body></html>
