<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SharedFS Foundation Test</title>
<style>:root{color-scheme:dark}body{font:14px system-ui;max-width:1050px;margin:28px auto;padding:0 18px;background:#0f172a;color:#e2e8f0}.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:18px;margin:14px 0}button{padding:9px 13px;margin:4px;border:0;border-radius:8px;cursor:pointer}.primary{background:#2563eb;color:#fff}.ok{color:#86efac}.bad{color:#fca5a5}.warn{color:#fde68a}pre{white-space:pre-wrap;background:#020617;padding:12px;border-radius:8px;max-height:380px;overflow:auto}.muted{color:#94a3b8}</style></head><body>
<h1>SharedFS Stage 01 — Foundation Test</h1><p class="muted">Select the same test folder in two browsers. This test creates Task-Management-Data inside it. No API or service is used.</p>
<div class="card"><button class="primary" id="pick">Select parent folder</button><button id="restore">Restore saved handle</button><button id="forget">Forget handle</button><div id="status">Disconnected.</div></div>
<div class="card"><button id="init" disabled>Initialize Task-Management-Data</button><button id="run" disabled>Run foundation tests</button><button id="write" disabled>Write browser record</button><button id="scan" disabled>Scan browser records</button></div>
<div class="card"><h2>Results</h2><pre id="out"></pre></div>
<script src="../js/shared-fs.js"></script><script>
const $=s=>document.querySelector(s),out=$('#out');let parent=null;\nconst fsCap=typeof window.showDirectoryPicker==='function';\nfunction capability(){if(fsCap)return true;enable(false);$('#pick').disabled=true;$('#restore').disabled=true;$('#status').textContent='SharedFS unavailable in this browser/context.';log('CAPABILITY FAIL: File System Access directory picker is unavailable. No fallback datastore will be used.','bad');log('Context: '+location.href,'warn');log('Browser: '+navigator.userAgent,'warn');return false}
function log(m,c='ok'){const x=document.createElement('div');x.className=c;x.textContent=new Date().toLocaleTimeString()+'  '+m;out.prepend(x)}
function enable(v){['init','run','write','scan'].forEach(x=>$('#'+x).disabled=!v)}
async function attach(h){parent=h;const data=await h.getDirectoryHandle('Task-Management-Data',{create:true});await TM.SharedFS.disconnect();await (async()=>{if(await TM.SharedFS.permission(data,true)!=='granted')throw Error('Read/write permission not granted');const db=await new Promise((res,rej)=>{const r=indexedDB.open('tm-shared-fs',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('handles'))r.result.createObjectStore('handles')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});await new Promise((res,rej)=>{const t=db.transaction('handles','readwrite');t.objectStore('handles').put(data,'workspace');t.oncomplete=res;t.onerror=()=>rej(t.error)});await TM.SharedFS.restore(false)})();$('#status').textContent='Connected: '+data.name;enable(true);log('Connected to '+data.name)}
$('#pick').onclick=async()=>{if(!capability())return;try{await attach(await window.showDirectoryPicker({mode:'readwrite'}))}catch(e){log(e.name+': '+e.message,'bad')}};
$('#restore').onclick=async()=>{if(!capability())return;try{const h=await TM.SharedFS.restore(true);if(!h)throw Error('No saved workspace handle or permission not granted');$('#status').textContent='Restored: '+h.name;enable(true);log('Saved handle restored')}catch(e){log(e.message,'warn')}};
$('#forget').onclick=async()=>{await TM.SharedFS.disconnect({forget:true});enable(false);$('#status').textContent='Disconnected; saved handle removed.';log('Saved handle removed','warn')};
$('#init').onclick=async()=>{try{const x=await TM.SharedFS.initialize();log('Workspace initialized: '+x.workspace.workspaceId);log('Schema v'+x.schema.schemaVersion)}catch(e){log(e.message,'bad')}};
$('#run').onclick=async()=>{try{await TM.SharedFS.initialize();let pass=0;const check=(ok,msg)=>{if(!ok)throw Error(msg);pass++;log('PASS '+msg)};
 check(TM.SharedFS.assertName('EVT-123.json')==='EVT-123.json','Windows-safe filename accepted');
 try{TM.SharedFS.assertName('CON.json');throw Error('Reserved name accepted')}catch(e){check(/Unsafe/.test(e.message),'Windows reserved filename rejected')}
 const id='TEST-'+crypto.randomUUID()+'.json',p=['_Recovery','Orphaned',id],obj={id,at:new Date().toISOString(),value:crypto.randomUUID()};await TM.SharedFS.createJSON(p,obj);check((await TM.SharedFS.readJSON(p)).value===obj.value,'JSON create/read/write verification');
 try{await TM.SharedFS.createJSON(p,obj);throw Error('Duplicate overwrite accepted')}catch(e){check(/overwrite/.test(e.message),'immutable create rejects duplicate filename')}
 const listed=await TM.SharedFS.list(['_Recovery','Orphaned'],{kind:'file',suffix:'.json'});check(listed.some(x=>x.name===id),'directory JSON listing');
 log('FOUNDATION RESULT: '+pass+'/4 PASS')}catch(e){log('FAIL '+e.message,'bad')}};
$('#write').onclick=async()=>{try{await TM.SharedFS.initialize();const id='BROWSER-'+crypto.randomUUID(),p=['Audit',id+'.json'];await TM.SharedFS.createJSON(p,{recordId:id,browser:navigator.userAgent,createdAt:new Date().toISOString(),clientId:localStorage.tmSharedFsClient||(localStorage.tmSharedFsClient=crypto.randomUUID())});log('WROTE '+id)}catch(e){log(e.message,'bad')}};
$('#scan').onclick=async()=>{try{const rows=await TM.SharedFS.list(['Audit'],{kind:'file',suffix:'.json'});const b=rows.filter(x=>x.name.startsWith('BROWSER-'));log('FOUND '+b.length+' browser record(s): '+b.map(x=>x.name).join(', '))}catch(e){log(e.message,'bad')}};
if(!fsCap)capability();\n</script></body></html>
