<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Management Regression Gate</title><style>body{font-family:system-ui;background:#111827;color:#e5e7eb;margin:0;padding:24px}main{max-width:1100px;margin:auto}.card{background:#1f2937;border:1px solid #374151;border-radius:12px;padding:18px;margin:14px 0}button{padding:10px 16px;border:0;border-radius:8px;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #374151}.pass{color:#86efac}.fail{color:#fca5a5}.warn{color:#fde68a}.muted{color:#9ca3af}code{font-family:ui-monospace,monospace}</style></head><body><main><h1>Task Management Regression Gate</h1><p class="muted">Read-only against organizational records except for one isolated <code>_Lab/Events</code> probe. Run against a disposable copy first when validating SMB behavior.</p><div class="card"><button id="connect">Select / Restore Workspace</button> <button id="run" disabled>Run Gate</button><span id="status"></span></div><div class="card"><h2>Results</h2><table><thead><tr><th>Check</th><th>Result</th><th>Details</th></tr></thead><tbody id="results"></tbody></table></div></main>
<script src="../js/filesystem.js"></script><script src="../js/store.js"></script><script src="../js/identity.js"></script><script src="../js/auth.js"></script><script src="../js/projects.js"></script><script src="../js/tasks.js"></script><script src="../js/tickets.js"></script><script src="../js/leaves.js"></script><script>
const $=s=>document.querySelector(s),results=$('#results');function row(name,status,details=''){const tr=document.createElement('tr');tr.innerHTML='<td></td><td></td><td></td>';tr.children[0].textContent=name;tr.children[1].textContent=status;tr.children[1].className=status==='PASS'?'pass':status==='FAIL'?'fail':'warn';tr.children[2].textContent=details;results.appendChild(tr)}async function connect(){let h=await TM.FileSystem.restoreWorkspace();if(!h||await TM.FileSystem.permission(h)!=='granted')h=await TM.FileSystem.selectWorkspace();await TM.Store.init();$('#run').disabled=false;$('#status').textContent=' Connected: '+h.name}$('#connect').onclick=()=>connect().catch(e=>row('Workspace','FAIL',e.message));
const types=['user','role','group','membership','session','userEvent','membershipEvent','groupEvent','project','projectEvent','projectMember','projectGroup','projectGroupEvent','task','taskEvent','taskComment','taskCommentEvent','announcement','publicLeave','publicLeaveEvent','ticket','ticketEvent','ticketComment','ticketCommentEvent','projectComment','projectCommentEvent','actionRecord','actionComment','actionCommentEvent','document','documentEvent','documentComment','documentCommentEvent','commentAttachment'];
async function scan(){let total=0,bad=0,ids=new Set(),dupes=0;for(const type of types){const rows=await TM.Store.list(type);for(const x of rows){total++;if(x._corrupt){bad++;row(type+' / '+x.file,'FAIL',x.error);continue}if(ids.has(x.id))dupes++;ids.add(x.id)}}row('Datastore JSON integrity',bad?'FAIL':'PASS',total+' records scanned; '+bad+' corrupt');row('Global record ID uniqueness',dupes?'FAIL':'PASS',dupes+' duplicate IDs');return{total,bad,dupes}}
async function refs(){let bad=0;const users=(await TM.Store.list('user')).filter(x=>!x._corrupt),groups=(await TM.Store.list('group')).filter(x=>!x._corrupt),projects=(await TM.Store.list('project')).filter(x=>!x._corrupt),tasks=(await TM.Store.list('task')).filter(x=>!x._corrupt),tickets=(await TM.Store.list('ticket')).filter(x=>!x._corrupt),actions=(await TM.Store.list('actionRecord')).filter(x=>!x._corrupt);const sets={user:new Set(users.map(x=>x.id)),group:new Set(groups.map(x=>x.id)),project:new Set(projects.map(x=>x.id)),task:new Set(tasks.map(x=>x.id)),ticket:new Set(tickets.map(x=>x.id)),action:new Set(actions.map(x=>x.id))};for(const m of (await TM.Store.list('membership')).filter(x=>!x._corrupt)){if(!sets.user.has(m.userId)||m.groupId&&!sets.group.has(m.groupId))bad++}for(const t of tasks)if(t.projectId&&!sets.project.has(t.projectId))bad++;for(const d of (await TM.Store.list('document')).filter(x=>!x._corrupt)){const k=d.parentType;if(sets[k]&&!sets[k].has(d.parentId))bad++}for(const a of (await TM.Store.list('commentAttachment')).filter(x=>!x._corrupt)){const k=a.parentType;if(sets[k]&&!sets[k].has(a.parentId))bad++}const leaves=(await TM.Store.list('publicLeave')).filter(x=>!x._corrupt),leaveIds=new Set(leaves.map(x=>x.id));for(const l of leaves)if(!sets.user.has(l.ownerId))bad++;for(const e of (await TM.Store.list('publicLeaveEvent')).filter(x=>!x._corrupt)){if(!leaveIds.has(e.leaveId)||!sets.user.has(e.actorId))bad++}row('Parent/reference integrity',bad?'FAIL':'PASS',bad+' broken references')}
async function calendarBoundary(){let bad=0,warn=0;for(const l of (await TM.Store.list('publicLeave')).filter(x=>!x._corrupt)){if(!l.ownerId||!l.title||!l.startDate||!l.endDate||l.endDate<l.startDate)bad++}for(const e of (await TM.Store.list('publicLeaveEvent')).filter(x=>!x._corrupt)){if(!['edit','delete'].includes(e.action))bad++;if(e.action==='edit'&&(!e.value||!e.value.title||!e.value.startDate||!e.value.endDate||e.value.endDate<e.value.startDate))bad++}const anns=(await TM.Store.list('announcement')).filter(x=>!x._corrupt);const legacy=anns.filter(x=>x.level==='reminder').length;if(legacy)warn=legacy;row('Public leave schema/lifecycle',bad?'FAIL':'PASS',bad+' invalid leave records/events');row('Private reminder boundary',warn?'WARN':'PASS',warn?warn+' legacy shared reminder announcement(s) found; ignored by current app':'No shared reminder announcements found')}
async function reducers(){let bad=0,checked=0;for(const p of (await TM.Store.list('project')).filter(x=>!x._corrupt)){checked++;try{await TM.Projects.state(p.id);await TM.Projects.timeline(p.id)}catch(e){bad++;row('Project reducer '+p.id,'FAIL',e.message)}}for(const t of (await TM.Store.list('task')).filter(x=>!x._corrupt)){checked++;try{await TM.Tasks.state(t.id);await TM.Tasks.timeline(t.id)}catch(e){bad++;row('Task reducer '+t.id,'FAIL',e.message)}}for(const t of (await TM.Store.list('ticket')).filter(x=>!x._corrupt)){checked++;try{await TM.Tickets.state(t.id);await TM.Tickets.timeline(t.id)}catch(e){bad++;row('Ticket reducer '+t.id,'FAIL',e.message)}}for(const l of (await TM.Store.list('publicLeave')).filter(x=>!x._corrupt)){checked++;try{await TM.Leaves.state(l.id)}catch(e){bad++;row('Leave reducer '+l.id,'FAIL',e.message)}}row('Reducer reconstruction',bad?'FAIL':'PASS',checked+' entities reconstructed; '+bad+' errors')}
async function visibility(){const users=(await TM.Store.list('user')).filter(x=>!x._corrupt),projects=await TM.Projects.list(),tasks=await TM.Tasks.standalone(),tickets=await TM.Tickets.list();let checks=0,bad=0;for(const u of users){try{const pv=await TM.Projects.listForUser(u.id),tv=await TM.Tasks.visibleStandalone(u.id),kv=await TM.Tickets.visible(u.id);checks+=pv.length+tv.length+kv.length;for(const x of pv)if(!projects.some(y=>y.id===x.id))bad++;for(const x of tv)if(!tasks.some(y=>y.id===x.id))bad++;for(const x of kv)if(!tickets.some(y=>y.id===x.id))bad++}catch(e){bad++;row('Visibility '+u.id,'FAIL',e.message)}}row('RBAC visibility reducers',bad?'FAIL':'PASS',users.length+' users evaluated; '+checks+' visible object grants; '+bad+' inconsistencies')}
async function writeProbe(){const token=crypto.randomUUID(),r=await TM.Store.create('event',{probe:true,token});const got=await TM.Store.get('event',r.id);if(got.token!==token)throw Error('read-back token mismatch');row('Immutable write/read probe','PASS',r.id+' retained in _Lab/Events for audit')}
async function run(){results.innerHTML='';$('#run').disabled=true;try{await scan();await refs();await calendarBoundary();await writeProbe();row('Gate completed','PASS','Review FAIL rows before freeze')}catch(e){row('Gate execution','FAIL',e.message)}finally{$('#run').disabled=false}}$('#run').onclick=run;
</script></body></html>
