<!doctype html><html><head><meta charset="utf-8"><title>Portable Bridge Test</title><style>body{font:14px system-ui;max-width:900px;margin:30px auto;background:#0f172a;color:#e2e8f0}input{width:70%;padding:8px}button{padding:9px;margin:4px}pre{background:#020617;padding:14px;white-space:pre-wrap}</style></head><body><h1>Stage 01C — Portable Bridge</h1><p>Run through <code>./task-management</code>, not file://.</p><input id="path" placeholder="/mnt/shared/task-management-data"><button id="select">Select workspace path</button><button id="run">Run tests</button><pre id="out"></pre><script src="../js/portable-bridge.js"></script><script>
const log=x=>out.textContent+=x+'\n';select.onclick=async()=>{try{const x=await TM.PortableBridge.select(path.value);log('PASS workspace '+x.workspace)}catch(e){log('FAIL '+e.message)}};
run.onclick=async()=>{try{const s=await TM.PortableBridge.status();if(!s?.ok)throw Error('bridge unavailable');log('PASS bridge reachable');for(const p of [['System'],['Identity'],['Tasks'],['Audit'],['_Recovery']])await TM.PortableBridge.mkdir(p);log('PASS directories');const id='EVT-'+crypto.randomUUID()+'.json',obj={id,at:new Date().toISOString()};await TM.PortableBridge.create(['Audit',id],JSON.stringify(obj,null,2));log('PASS immutable create '+id);try{await TM.PortableBridge.create(['Audit',id],'{}');throw Error('duplicate accepted')}catch(e){if(!/exists/.test(e.message))throw e;log('PASS duplicate rejected')}const x=JSON.parse((await TM.PortableBridge.read(['Audit',id])).text);if(x.id!==id)throw Error('read mismatch');log('PASS read verified');const list=await TM.PortableBridge.list(['Audit']);if(!list.items.some(i=>i.name===id))throw Error('list missing record');log('PASS list verified');log('RESULT 5/5 PASS')}catch(e){log('FAIL '+e.message)}};
</script></body></html>
