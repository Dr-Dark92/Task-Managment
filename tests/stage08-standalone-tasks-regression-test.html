<!doctype html><meta charset="utf-8"><title>Stage 08 Standalone Tasks Regression</title><style>body{font:14px system-ui;margin:30px;max-width:950px}button{padding:10px 14px}pre{white-space:pre-wrap;background:#111;color:#ddd;padding:16px}</style><h1>Stage 08 — Standalone Tasks Regression</h1><p>Select a <strong>fresh test workspace</strong>.</p><button id="run">Select Fresh Workspace & Run</button><pre id="out">Ready.</pre>
<script src="../js/filesystem.js"></script><script src="../js/store.js"></script><script src="../js/identity.js"></script><script src="../js/auth.js"></script><script src="../js/admin.js"></script><script src="../js/projects.js"></script><script src="../js/tasks.js"></script><script>
const out=document.querySelector('#out'),log=s=>out.textContent+=s+'\n',ok=(n,v)=>{if(!v)throw Error(n+' failed');log(n+' PASS')};document.querySelector('#run').onclick=async()=>{out.textContent='';try{
await TM.FileSystem.selectWorkspace();await TM.FileSystem.ensurePermission(TM.FileSystem.current());await TM.Store.bootstrapSystem();ok('FRESH WORKSPACE',(await TM.Store.list('user')).filter(x=>!x._corrupt).length===0);
const admin=await TM.Auth.firstAdmin({username:'s8admin',displayName:'S8 Admin',password:'Stage08-Admin-Password!'}),roles=(await TM.Store.list('role')).filter(x=>!x._corrupt),tl=roles.find(r=>r.systemKey==='team_leader'),emp=roles.find(r=>r.systemKey==='employee'),ga=await TM.Admin.createGroup(admin.id,{name:'Alpha'}),gb=await TM.Admin.createGroup(admin.id,{name:'Bravo'});
const la=await TM.Admin.createUser(admin.id,{username:'leadA',displayName:'Leader A',password:'Stage08-LeaderA-Pass!',roleId:tl.id,groupId:ga.id}),lb=await TM.Admin.createUser(admin.id,{username:'leadB',displayName:'Leader B',password:'Stage08-LeaderB-Pass!',roleId:tl.id,groupId:gb.id}),ea=await TM.Admin.createUser(admin.id,{username:'empA',displayName:'Employee A',password:'Stage08-EmployeeA-Pass!',roleId:emp.id,groupId:ga.id}),eb=await TM.Admin.createUser(admin.id,{username:'empB',displayName:'Employee B',password:'Stage08-EmployeeB-Pass!',roleId:emp.id,groupId:gb.id}),eb2=await TM.Admin.createUser(admin.id,{username:'empB2',displayName:'Employee B2',password:'Stage08-EmployeeB2-Pass!',roleId:emp.id,groupId:gb.id});
const own=await TM.Tasks.create(la.id,{responsibleGroupId:ga.id,title:'Own group task',assigneeId:ea.id});ok('STANDALONE HAS NO PROJECT',!own.projectId);ok('OWN GROUP DIRECT ASSIGN',own.status==='Assigned'&&own.assigneeId===ea.id);
const cross=await TM.Tasks.create(la.id,{responsibleGroupId:gb.id,title:'Cross group task'});ok('CROSS GROUP PENDING',cross.status==='Pending Group Acceptance'&&!cross.assigneeId);
ok('DESTINATION UNASSIGNED QUEUE VISIBLE',(await TM.Tasks.visibleStandalone(eb.id)).some(t=>t.id===cross.id));
await TM.Tasks.acceptGroup(lb.id,cross.id);await TM.Tasks.assign(lb.id,cross.id,eb.id);const assigned=await TM.Tasks.state(cross.id);ok('DESTINATION ASSIGNMENT',assigned.status==='Assigned'&&assigned.assigneeId===eb.id);
ok('ASSIGNEE SEES ASSIGNED TASK',(await TM.Tasks.visibleStandalone(eb.id)).some(t=>t.id===cross.id));ok('PEER DOES NOT SEE ASSIGNED TASK',!(await TM.Tasks.visibleStandalone(eb2.id)).some(t=>t.id===cross.id));ok('GROUP LEADER RETAINS VISIBILITY',(await TM.Tasks.visibleStandalone(lb.id)).some(t=>t.id===cross.id));ok('CREATOR RETAINS VISIBILITY',(await TM.Tasks.visibleStandalone(la.id)).some(t=>t.id===cross.id));
await TM.Tasks.transition(eb.id,cross.id,'acceptAssignment');await TM.Tasks.transition(eb.id,cross.id,'startWork');await TM.Tasks.transition(eb.id,cross.id,'submitReview');await TM.Tasks.transition(lb.id,cross.id,'complete');ok('FULL STANDALONE LIFECYCLE',(await TM.Tasks.state(cross.id)).status==='Completed');
let locked=false;try{await TM.Tasks.assign(lb.id,cross.id,eb2.id)}catch{locked=true}ok('TERMINAL REASSIGNMENT BLOCKED',locked);log('\nSTAGE 08 REGRESSION PASS');log('NOTE: sequential gate only; simultaneous filesystem races remain outside this test.');
}catch(e){log('\nFAIL: '+e.message);console.error(e)}};</script>
