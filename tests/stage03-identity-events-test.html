<!doctype html><html><head><meta charset="utf-8"><title>Stage 03 Identity Events</title><style>body{font:15px system-ui;max-width:900px;margin:30px auto}button,input{padding:9px;margin:4px}pre{background:#eee;padding:15px;white-space:pre-wrap}</style></head><body><h1>Stage 03 — Identity Events + Administrator Protection</h1><input id="pass" type="password" value="Jarvis-Test-2026!"><button id="select">Select Stage02 Workspace</button><button id="run" disabled>Run Protection Test</button><pre id="out"></pre><script src="../js/filesystem.js"></script><script src="../js/store.js"></script><script src="../js/auth.js"></script><script src="../js/identity.js"></script><script>
const log=s=>out.textContent+=s+'\n';select.onclick=async()=>{try{const h=await TM.FileSystem.selectWorkspace();await TM.FileSystem.ensurePermission();await TM.Store.bootstrapSystem();run.disabled=false;log('CONNECT PASS '+h.name)}catch(e){log('CONNECT FAIL '+e.message)}};run.onclick=async()=>{try{const users=(await TM.Store.list('user')).filter(x=>!x._corrupt),admin=users[0];if(!admin)throw Error('Use the Stage 02 workspace containing the first admin');log('ACTIVE ADMINS '+(await TM.Identity.activeAdmins()).length);try{await TM.Identity.setUserEnabled(admin.id,false,admin.id);log('FINAL ADMIN DISABLE FAIL accepted')}catch(e){log('FINAL ADMIN DISABLE PASS '+e.message)}const role=(await TM.Store.list('role')).find(r=>r.systemKey==='administrator'),m=(await TM.Store.list('membership')).find(x=>x.userId===admin.id&&x.roleId===role.id);try{await TM.Identity.setMembershipEnabled(m.id,false,admin.id);log('FINAL ADMIN DEMOTE FAIL accepted')}catch(e){log('FINAL ADMIN DEMOTE PASS '+e.message)}const pw=await TM.Auth.passwordRecord(pass.value),u2=await TM.Store.createUser({username:'admin2-'+crypto.randomUUID().slice(0,8),displayName:'Second Administrator',...pw});await TM.Store.addMembership({userId:u2.id,roleId:role.id});log('SECOND ADMIN PASS '+u2.id);log('ACTIVE ADMINS '+(await TM.Identity.activeAdmins()).length);await TM.Identity.setUserEnabled(admin.id,false,u2.id);log('FIRST ADMIN DISABLE WITH BACKUP PASS');const state=await TM.Identity.userState(admin.id);log(state.enabled===false?'REDUCER PASS enabled=false':'REDUCER FAIL');log('ACTIVE ADMINS '+(await TM.Identity.activeAdmins()).length)}catch(e){log('TEST FAIL '+e.message)}};</script></body></html>
