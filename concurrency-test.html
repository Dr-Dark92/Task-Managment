<!doctype html><html><head><meta charset="utf-8"><title>Concurrent JSON Write Test</title>
<style>body{font:15px system-ui;max-width:850px;margin:35px auto;padding:0 18px}button,input{padding:9px;margin:4px}input{width:220px}pre{background:#eee;padding:14px;white-space:pre-wrap}.ok{color:green}.bad{color:#b00020}</style></head><body>
<h1>Concurrent Immutable JSON Test</h1>
<p>Open this page in two Chrome profiles/windows, select the same shared folder, give each client a different name, then write records simultaneously.</p>
<input id="client" placeholder="Client name, e.g. PC-A"><button id="selectBtn" type="button">Select Shared Location</button><button id="writeBtn" type="button" disabled>Write 25 Events</button><button id="scanBtn" type="button" disabled>Scan & Verify</button><button id="cleanupBtn" type="button" disabled>Cleanup My Events</button>
<p><b id="folder">No folder selected</b></p><pre id="out"></pre>
<script>
let root=null,events=null,myIds=[];const out=document.querySelector('#out');
function log(s,ok){const x=document.createElement('span');if(ok===true)x.className='ok';if(ok===false)x.className='bad';x.textContent=s+'\n';out.appendChild(x)}
async function select(){try{root=await showDirectoryPicker({mode:'readwrite'});const p=await root.requestPermission({mode:'readwrite'});if(p!=='granted')throw Error('permission '+p);const lab=await root.getDirectoryHandle('TM-Concurrency-Test',{create:true});events=await lab.getDirectoryHandle('Events',{create:true});document.getElementById('folder').textContent='Selected: '+root.name+'/TM-Concurrency-Test/Events';document.getElementById('writeBtn').disabled=false;document.getElementById('scanBtn').disabled=false;document.getElementById('cleanupBtn').disabled=false;log('SELECT PASS',true)}catch(e){log('SELECT FAIL: '+e.message,false)}}
async function createExclusive(name,text){const existing=[];for await(const k of events.keys())if(k===name)existing.push(k);if(existing.length)throw Error('UUID collision '+name);const h=await events.getFileHandle(name,{create:true});const w=await h.createWritable();await w.write(text);await w.close()}
async function writeBatch(){const who=document.getElementById('client').value.trim();if(!who)return log('Enter a client name first.',false);myIds=[];const start=performance.now();try{for(let i=0;i<25;i++){const id='EVT-'+crypto.randomUUID()+'.json';const rec={id:id.slice(0,-5),client:who,sequence:i+1,createdAt:new Date().toISOString(),nonce:crypto.randomUUID()};await createExclusive(id,JSON.stringify(rec,null,2));myIds.push(id)}log('WRITE PASS: 25 independent events by '+who+' in '+Math.round(performance.now()-start)+' ms',true)}catch(e){log('WRITE FAIL: '+e.message,false)}}
async function verify(){let total=0,bad=0,clients={};try{for await(const [name,h] of events.entries()){if(h.kind!=='file'||!name.endsWith('.json'))continue;total++;try{const o=JSON.parse(await (await h.getFile()).text());if(!o.id||!o.client||!o.nonce)throw Error();clients[o.client]=(clients[o.client]||0)+1}catch{bad++}}log('SCAN: '+total+' JSON events');log('CLIENTS: '+JSON.stringify(clients));log(bad?'VERIFY FAIL: '+bad+' corrupt records':'VERIFY PASS: all records parse independently',bad===0);if(Object.keys(clients).length>=2)log('MULTI-CLIENT PASS: records from '+Object.keys(clients).length+' clients coexist',true);else log('MULTI-CLIENT WAIT: run a second client against the same folder.')}catch(e){log('SCAN FAIL: '+e.message,false)}}
async function clean(){let n=0;for(const id of myIds){try{await events.removeEntry(id);n++}catch{}}log('CLEANUP: removed '+n+' records from this session',true);myIds=[]}
document.getElementById('selectBtn').addEventListener('click',select);document.getElementById('writeBtn').addEventListener('click',writeBatch);document.getElementById('scanBtn').addEventListener('click',verify);document.getElementById('cleanupBtn').addEventListener('click',clean);
log('Browser: '+navigator.userAgent);log('Directory picker: '+typeof showDirectoryPicker);
</script></body></html>
